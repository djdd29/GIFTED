<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DATE GIFT</title>

<style>

* {

  box-sizing: border-box;

  margin: 0;

  padding: 0;

}

body {

  background: #080808;

  color: white;

  font-family: Arial, sans-serif;

  min-height: 100vh;

  overflow-x: hidden;

}

body::before {

  content: "";

  position: fixed;

  width: 500px;

  height: 500px;

  background: #ffffff08;

  filter: blur(100px);

  border-radius: 50%;

  top: -200px;

  left: 50%;

  transform: translateX(-50%);

  pointer-events: none;

}

header {

  height: 75px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 7%;

  border-bottom: 1px solid #ffffff12;

  position: relative;

}

.logo {

  font-size: 27px;

  font-weight: 900;

  letter-spacing: 8px;

}

.status {

  color: #aaa;

  font-size: 12px;

  border: 1px solid #333;

  padding: 9px 15px;

  border-radius: 30px;

}

.status span {

  color: #8dffae;

}

main {

  max-width: 850px;

  margin: auto;

  padding: 65px 20px 40px;

  text-align: center;

  position: relative;

}

.tag {

  display: inline-block;

  border: 1px solid #383838;

  padding: 8px 18px;

  border-radius: 30px;

  color: #ccc;

  font-size: 12px;

  letter-spacing: 2px;

  margin-bottom: 25px;

}

h1 {

  font-size: clamp(34px, 7vw, 55px);

  font-weight: 900;

  margin-bottom: 15px;

}

h1 span {

  color: #aaa;

}

.subtitle {

  color: #888;

  font-size: 15px;

  line-height: 2;

}

.gift-area {

  margin: 40px auto 25px;

  width: 100%;

  max-width: 390px;

  height: 300px;

  display: flex;

  justify-content: center;

  align-items: center;

  position: relative;

}

.glow {

  position: absolute;

  width: 230px;

  height: 230px;

  background: #ffffff12;

  filter: blur(65px);

  border-radius: 50%;

}

.gift {

  position: relative;

  width: 175px;

  height: 150px;

  cursor: pointer;

  animation: float 3s ease-in-out infinite;

  transition: .5s;

  filter: drop-shadow(0 15px 25px #ffffff20);

}

.gift:hover {

  transform: scale(1.08);

}

.box-body {

  position: absolute;

  width: 175px;

  height: 110px;

  bottom: 0;

  background: linear-gradient(135deg,#eeeeee,#777,#c7c7c7);

  border-radius: 7px 7px 12px 12px;

  box-shadow: inset 0 -12px 20px #0005;

}

.box-body::before {

  content: "";

  position: absolute;

  width: 28px;

  height: 100%;

  background: linear-gradient(90deg,#555,#eee,#888);

  left: 50%;

  transform: translateX(-50%);

}

.box-lid {

  position: absolute;

  width: 190px;

  height: 37px;

  top: 7px;

  left: -7px;

  background: linear-gradient(135deg,#fff,#888,#ddd);

  border-radius: 7px;

  box-shadow: 0 5px 10px #0008;

  z-index: 2;

}

.box-lid::before {

  content: "";

  position: absolute;

  width: 28px;

  height: 100%;

  background: linear-gradient(90deg,#555,#fff,#777);

  left: 50%;

  transform: translateX(-50%);

}

.bow {

  position: absolute;

  top: -21px;

  left: 50%;

  transform: translateX(-50%);

  width: 75px;

  height: 35px;

  z-index: 3;

}

.bow::before,.bow::after {

  content: "";

  position: absolute;

  width: 38px;

  height: 27px;

  border: 8px solid #ddd;

  border-radius: 50% 50% 10% 50%;

}

.bow::before {

  left: 0;

  transform: rotate(25deg);

}

.bow::after {

  right: 0;

  transform: rotate(65deg);

}

@keyframes float {

  0%,100% { transform: translateY(0); }

  50% { transform: translateY(-13px); }

}

.opening .gift {

  animation: shake .5s infinite;

}

@keyframes shake {

  0%,100% { transform: rotate(0); }

  25% { transform: rotate(-7deg); }

  75% { transform: rotate(7deg); }

}

button {

  border: none;

  background: linear-gradient(135deg,#fff,#c5c5c5);

  color: #080808;

  padding: 17px 55px;

  border-radius: 12px;

  font-size: 17px;

  font-weight: 900;

  cursor: pointer;

  transition: .25s;

  box-shadow: 0 5px 30px #ffffff18;

}

button:hover {

  transform: translateY(-3px);

  box-shadow: 0 8px 35px #ffffff35;

}

button:disabled {

  opacity: .5;

  cursor: not-allowed;

  transform: none;

}

.hint {

  color: #666;

  font-size: 12px;

  margin-top: 20px;

}

.result {

  display: none;

  margin: 35px auto 0;

  max-width: 440px;

  padding: 30px 20px;

  border: 1px solid #444;

  border-radius: 20px;

  background: linear-gradient(145deg,#191919,#0d0d0d);

  animation: appear .6s ease;

}

@keyframes appear {

  from { opacity: 0; transform: translateY(25px) scale(.95); }

  to { opacity: 1; transform: translateY(0) scale(1); }

}

.result-icon {

  font-size: 60px;

  margin-bottom: 15px;

}

.result h2 {

  font-size: 24px;

  margin-bottom: 12px;

}

.result p {

  color: #aaa;

  line-height: 2;

  font-size: 14px;

}

.result-name {

  color: white;

  font-size: 21px;

  font-weight: bold;

  margin: 20px 0;

}

footer {

  margin-top: 65px;

  padding: 25px;

  border-top: 1px solid #ffffff12;

  color: #555;

  font-size: 12px;

  letter-spacing: 2px;

}

@media(max-width:500px) {

  main { padding-top: 45px; }

  .gift-area { height: 260px; }

  header { padding: 0 20px; }

}

</style>

</head>

<body>

<header>

  <div class="logo">DATE</div>

  <div class="status"><span>●</span> GIFT EVENT</div>

</header>

<main>

  <div class="tag">DATE STORE PRESENTS</div>

  <h1>افتح <span>هديتك</span></h1>

  <p class="subtitle">

    صندوقك ينتظرك! اضغط على زر الاستلام واكتشف جائزتك

    <br>

    حظاً موفقاً للجميع ❤️

  </p>

  <div class="gift-area" id="giftArea">

    <div class="glow"></div>

    <div class="gift" id="gift">

      <div class="bow"></div>

      <div class="box-lid"></div>

      <div class="box-body"></div>

    </div>

  </div>

  <button id="openBtn" onclick="openGift()">

    🎁 استلام الهدية

  </button>

  <p class="hint" id="hint">

    اضغط مرة واحدة لفتح صندوق الهدايا

  </p>

  <div class="result" id="result">

    <div class="result-icon" id="resultIcon">🎉</div>

    <h2 id="resultTitle">مبروك!</h2>

    <p>لقد حصلت على جائزتك من DATE</p>

    <div class="result-name" id="resultName"></div>

    <p id="resultMessage">تواصل مع إدارة DATE لاستلام جائزتك</p>

  </div>

</main>

<footer>

  DATE STORE • THANK YOU FOR PARTICIPATING

</footer>

<script>

// الجوائز ونسب الفوز

// مجموع النسب = 100%

const prizes = [

  {name:"50M ProBot Credits", chance:30, icon:"💰"},

  {name:"2 Discord Boosts", chance:3.1, icon:"🚀"},

  {name:"Nitro Promo", chance:5, icon:"💎"},

  {name:"حساب فورت نايت من 1 إلى 20 سكن", chance:3, icon:"🎮"},

  {name:"300M ProBot Credits", chance:0.90, icon:"💰"},

  {name:"حساب فورت نايت من 20 إلى 50 سكن", chance:1, icon:"🎮"},

  {name:"50 Robux", chance:1, icon:"🟣"},

  {name:"100M ProBot Credits", chance:5, icon:"💰"},

  {name:"10 Robux", chance:3, icon:"🟣"},

  {name:"20 Robux", chance:2, icon:"🟣"},

  {name:"حساب ديسكورد عشوائي", chance:2.2, icon:"💬"},

  {name:"4 Discord Boosts", chance:2.88, icon:"🚀"},

  {name:"رتبة مميزة", chance:4, icon:"👑"},

  {name:"رتبة بصلاحيات مميزة", chance:5, icon:"🛡️"},

  {name:"30M ProBot Credits", chance:19.84, icon:"💰"},

  {name:"حظ أوفر", chance:12.08, icon:"🍀"}

];

// لا تضف Nitro Gift أو 14 Boost إلى مصفوفة السحب

function drawPrize() {

  const random = Math.random() * 100;

  let total = 0;

  for (const prize of prizes) {

    total += prize.chance;

    if (random < total) {

      return prize;

    }

  }

  return prizes[prizes.length - 1];

}

function openGift() {

  const alreadyOpened = localStorage.getItem("date_gift_opened");

  if (alreadyOpened) {

    showAlreadyOpened();

    return;

  }

  const button = document.getElementById("openBtn");

  const area = document.getElementById("giftArea");

  button.disabled = true;

  button.textContent = "جاري فتح الهدية...";

  area.classList.add("opening");

  setTimeout(() => {

    const prize = drawPrize();

    localStorage.setItem("date_gift_opened", "true");

    localStorage.setItem("date_gift_result", JSON.stringify(prize));

    area.classList.remove("opening");

    area.style.display = "none";

    button.style.display = "none";

    document.getElementById("hint").style.display = "none";

    document.getElementById("resultIcon").textContent = prize.icon;

    if (prize.name === "حظ أوفر") {

      document.getElementById("resultTitle").textContent = "حظ أوفر ❤️";

      document.getElementById("resultMessage").textContent =

        "لا تحزن! نتمنى لك حظاً أفضل في المرة القادمة";

    } else {

      document.getElementById("resultTitle").textContent = "مبروك! 🎉";

      document.getElementById("resultMessage").textContent =

        "تواصل مع إدارة DATE لاستلام جائزتك";

    }

    document.getElementById("resultName").textContent = prize.name;

    document.getElementById("result").style.display = "block";

  }, 2200);

}

function showAlreadyOpened() {

  const saved = localStorage.getItem("date_gift_result");

  const prize = saved ? JSON.parse(saved) : null;

  document.getElementById("giftArea").style.display = "none";

  document.getElementById("openBtn").style.display = "none";

  document.getElementById("hint").style.display = "none";

  if (prize) {

    document.getElementById("resultIcon").textContent = prize.icon;

    document.getElementById("resultTitle").textContent =

      prize.name === "حظ أوفر" ? "حظ أوفر ❤️" : "هذه جائزتك السابقة";

    document.getElementById("resultName").textContent = prize.name;

    document.getElementById("resultMessage").textContent =

      "لقد فتحت هديتك مسبقاً";

    document.getElementById("result").style.display = "block";

  }

}

// منع إعادة الفتح في نفس المتصفح

window.addEventListener("load", () => {

  if (localStorage.getItem("date_gift_opened")) {

    showAlreadyOpened();

  }

});

</script>

</body>

</html>
